<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="200" height="200">
  <!-- Dark green background with rounded corners (great for app icons) -->
  <rect width="100" height="100" rx="22" fill="#064E3B" />
  
  <!-- Grouping for the minimal, bold line-art style -->
  <g stroke="#4ADE80" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    
    <!-- Camera Body (The Tree Canopy) -->
    <rect x="28" y="26" width="44" height="28" rx="5" />
    
    <!-- Camera Lens (Solid circle for contrast) -->
    <circle cx="50" cy="40" r="6" fill="#4ADE80" stroke="none"/>
    
    <!-- Camera Shutter Button -->
    <line x1="36" y1="20" x2="44" y2="20" />

    <!-- The Base (The Tree Trunk) -->
    <line x1="50" y1="88" x2="50" y2="70" />
    
    <!-- Left Hand / Branch cradling the camera -->
    <path d="M 50 70 C 22 70, 16 56, 16 44" />
    
    <!-- Right Hand / Branch cradling the camera -->
    <path d="M 50 70 C 78 70, 84 56, 84 44" />

  </g>
</svg>
